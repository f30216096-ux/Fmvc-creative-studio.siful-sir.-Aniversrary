<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160813">
<title>Siful ♥ Dithi | Happy Anniversary</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--pink:#ff8dbd;--soft:#ffd9e9;--gold:#ffe7ad;--bg:#160813}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100svh;overflow-x:hidden;background:var(--bg);color:#fff8fb;font-family:'DM Sans',sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-3}
.glow{position:fixed;inset:-20%;z-index:-2;pointer-events:none;filter:blur(75px);background:radial-gradient(ellipse at 25% 30%,#a52a6755,transparent 36%),radial-gradient(ellipse at 75% 72%,#572c8755,transparent 34%),radial-gradient(ellipse at 60% 5%,#ef709744,transparent 25%);animation:glow 18s ease-in-out infinite alternate}
@keyframes glow{to{transform:translate(3%,-2%) scale(1.1)}}
.wrap{width:min(800px,92vw);margin:auto;padding:22px 0 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:2px;color:#e8cbdc;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:9px}.brand i{font-style:normal;border:1px solid #ffb4d666;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:#ffd9e9}
.date{padding:9px 12px;border:1px solid #ffffff20;border-radius:99px;background:#ffffff08;white-space:nowrap}
.track{height:2px;background:#ffffff19;margin:20px 0;overflow:hidden;border-radius:5px}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff79b4,#ffe6ad);transition:width .7s}
.stage{min-height:min(690px,76svh);display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;border:1px solid #ffffff22;border-radius:30px;background:linear-gradient(145deg,#ffffff12,#ffffff04);box-shadow:0 30px 90px #0005,inset 0 1px #ffffff0b;backdrop-filter:blur(16px)}
.stage:before,.stage:after{content:"";position:absolute;border:1px solid #ffb5d51a;border-radius:50%;z-index:-1;pointer-events:none}
.stage:before{width:390px;height:390px;top:-265px;right:-170px}.stage:after{width:280px;height:280px;bottom:-210px;left:-130px}
.scene{width:100%;padding:clamp(24px,6vw,54px);text-align:center;animation:enter .8s cubic-bezier(.16,1,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
.kicker{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
h1,h2{font-family:'Playfair Display',serif;font-weight:500;line-height:1.12;margin:0 0 18px}
h1{font-size:clamp(42px,9vw,76px)}h2{font-size:clamp(31px,7vw,52px)}
.gradient{background:linear-gradient(110deg,#fff,#ffc3df 50%,#ffe7ad);-webkit-background-clip:text;background-clip:text;color:transparent}
.script{font-family:'Great Vibes',cursive;font-size:clamp(48px,11vw,86px);line-height:1.05;color:#ffc2dc;text-shadow:0 0 25px #ff6ba944}
.sub{font-size:14px;line-height:1.9;color:#e4cedd;max-width:510px;margin:0 auto 22px}
.names{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0}
.name{font:clamp(27px,6vw,43px) 'Playfair Display',serif}
.heart{color:#ff91bd;font-size:24px;animation:beat 1.5s infinite;filter:drop-shadow(0 0 15px #ff72b877)}
@keyframes beat{50%{transform:scale(1.25)}}
.btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}
button{border:1px solid #ffffff29;border-radius:99px;padding:14px 22px;background:#ffffff0a;color:#fff4fa;font:600 13px 'DM Sans',sans-serif;cursor:pointer;transition:transform .25s,background .25s}
button:hover{transform:translateY(-3px);background:#ffffff16}
button.main{border:0;color:#351323;background:linear-gradient(110deg,#ffd6e7,#ff8cbb 58%,#ffe6ae);box-shadow:0 8px 30px #ff75b42e}
.scene-art{height:200px;position:relative;display:grid;place-items:center;margin:0 auto 15px;max-width:320px}
.orbit{position:absolute;border:1px solid #ffb6d53a;border-radius:50%;animation:spin 17s linear infinite}
.orbit.a{width:150px;height:150px}.orbit.b{width:230px;height:105px;transform:rotate(45deg);animation-direction:reverse;animation-duration:23s}
.orbit:before,.orbit:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe7ad;box-shadow:0 0 16px #ffe7ad}
.orbit:before{top:8%;left:23%}.orbit:after{right:13%;bottom:12%;background:#ff91bd}
@keyframes spin{to{rotate:360deg}}
.big-heart{font-size:70px;filter:drop-shadow(0 0 25px #ff6aa955);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(5deg)}}
.scene-emoji{font-size:54px;display:inline-block;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 20px #ffb6d533)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:25px auto}
.tile{min-height:125px;padding:16px 8px;border:1px solid #ffffff1b;border-radius:18px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;animation:tilefloat 4s ease-in-out infinite}
.tile:nth-child(2){animation-delay:-1.2s}.tile:nth-child(3){animation-delay:-2.3s}
@keyframes tilefloat{50%{transform:translateY(-5px)}}
.tile .icon{font-size:28px}.tile b{font-size:11px;color:#ffdaea}.tile span{font-size:10px;color:#d4bed2;line-height:1.5}
.envelope-wrap{height:145px;width:170px;position:relative;margin:0 auto 20px;animation:float 4s infinite;filter:drop-shadow(0 14px 22px #0004)}
.envelope{position:absolute;left:0;right:0;bottom:0;height:105px;border-radius:8px;background:linear-gradient(135deg,#ee76ad,#a43b77);overflow:hidden}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(35deg,transparent 49%,#ffffff2c 50%,transparent 51%),linear-gradient(-35deg,transparent 49%,#ffffff22 50%,transparent 51%)}
.flap{position:absolute;top:40px;left:0;width:0;height:0;border-left:85px solid transparent;border-right:85px solid transparent;border-top:65px solid #ffc0d9;transform-origin:top;animation:openflap 4s ease-in-out infinite}
@keyframes openflap{0%,30%,100%{transform:rotateX(0)}48%,78%{transform:rotateX(180deg)}}
.seal{position:absolute;top:76px;left:calc(50% - 16px);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#ffe7ad;color:#a12e67}
.note{max-width:560px;margin:0 auto;padding:clamp(20px,5vw,30px);text-align:left;border:1px solid #ffd5e524;border-radius:20px;background:#ffffff08;color:#f2dfea;font-size:14px;line-height:1.95}
.note strong{color:#ffd1e4}
.final-circle{height:180px;width:180px;margin:0 auto 24px;border:1px solid #ffb9d54a;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 70px #ff72b418,inset 0 0 35px #ff72b410}
.final-circle:before,.final-circle:after{content:"";position:absolute;inset:10px;border:1px dashed #ffe7b04a;border-radius:50%;animation:spin 24s linear infinite}
.final-circle:after{inset:-10px;border-style:solid;border-color:#ffb9d522;animation-direction:reverse}
.final-circle span{font-size:70px;animation:beat 2s infinite}
footer{text-align:center;padding:19px 0 8px;font-size:12px;letter-spacing:3px;color:#e7c6dc}
footer b{font-weight:700;background:linear-gradient(90deg,#ffd8e8,#ff9dc6,#ffe7ad);-webkit-background-clip:text;background-clip:text;color:transparent}
footer small{display:block;margin-top:7px;font-size:9px;letter-spacing:1.5px;color:#9f879f}
.confetti{position:fixed;top:-25px;z-index:9;pointer-events:none;animation:fall var(--dur) linear forwards}
@keyframes fall{to{transform:translate(var(--drift),110svh) rotate(var(--spin));opacity:.12}}
.spark{position:absolute;pointer-events:none;color:#ffe7ad;animation:spark .9s forwards}
@keyframes spark{from{opacity:0;transform:scale(.2)}30%{opacity:1}to{opacity:0;transform:translateY(-30px) scale(1.5)}}
@media(max-width:520px){.stage{min-height:650px;border-radius:24px}.scene{padding:25px 18px}.gallery{gap:6px}.tile{padding:12px 5px;min-height:130px}.tile span{font-size:9px}.date{font-size:9px;padding:8px}.scene-art{transform:scale(.92)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas><div class="glow"></div>
<main class="wrap">
<header><div class="brand"><i>♡</i><span>A LITTLE FOREVER</span></div><span class="date" id="date"></span></header>
<div class="track"><div class="fill" id="fill"></div></div>
<section class="stage" id="stage"><div class="scene" id="scene"></div></section>
<footer><b>FM CREATIVE STUDIO</b><small>MADE WITH LOVE · SIFUL & DITHI</small></footer>
</main>
<script>
const today=new Date();
const longDate=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric'}).format(today);
document.getElementById('date').textContent=longDate;
const pages=[
`<div class="kicker">A surprise from a husband to his wife</div><div class="scene-art"><div class="orbit a"></div><div class="orbit b"></div><div class="big-heart">💗</div></div><div class="script">For my Dithi...</div><h1 class="gradient">My love, my home.</h1><p class="sub">I made a little world just for you. Ready, my love? There’s a surprise waiting on every page. 💕</p><div class="names"><span class="name">Siful</span><span class="heart">♥</span><span class="name">Dithi</span></div><div class="btns"><button class="main" onclick="go(1)">Come with me, love ✨</button></div>`,
`<div class="kicker">Just for you, my beautiful wife</div><div class="scene-art"><div class="orbit a"></div><div class="orbit b"></div><div class="big-heart">🌹</div></div><div class="script">My sweetest Dithi</div><h2 class="gradient">You make my world<br>more beautiful.</h2><p class="sub">If I could choose all over again, I’d still want the same hand to hold, the same smile to come home to, and the same heart beside mine. Yours, always. ❤️</p><div class="btns"><button onclick="go(0)">← Back</button><button class="main" onclick="go(2)">There’s more, my love →</button></div>`,
`<div class="kicker">Little things I wish for us</div><div class="scene-emoji">🥹💗</div><h2 class="gradient">A thousand tomorrows<br>with you.</h2><p class="sub">My love, may we keep laughing over silly things, finding comfort in each other, and making beautiful memories—one ordinary day at a time.</p><div class="gallery"><div class="tile"><div class="icon">🤍</div><b>Always us</b><span>Through every season.</span></div><div class="tile"><div class="icon">🌙</div><b>Our little world</b><span>My favourite place is with you.</span></div><div class="tile"><div class="icon">💐</div><b>More memories</b><span>So much life left to share.</span></div></div><div class="btns"><button onclick="go(1)">← Back</button><button class="main" onclick="go(3)">Open my letter 💌</button></div>`,
`<div class="kicker">A letter from Siful, with all my heart</div><div class="envelope-wrap"><div class="envelope"></div><div class="flap"></div><div class="seal">♥</div></div><div class="script">To my wife, Dithi</div><div class="note"><strong>My dearest Dithi,</strong><br><br>Happy Anniversary, my love. 💖 You are more than my wife—you are my favourite person, my comfort after a long day, and the smile I’m always grateful for. Thank you for being part of my life and for making our little world feel so special.<br><br>I wish for us a lifetime of laughter, patience, kindness, and dreams we get to chase together. On the easy days and the difficult ones, I hope we always remember that we’re on the same team.<br><br><strong>I may not have perfect words for everything I feel, but I’ll keep finding little ways to remind you how precious you are to me. I love you, Dithi. Today, tomorrow, and in all the days ahead. ❤️</strong><br><br>Forever yours,<br><strong>Your Siful 💋</strong></div><div class="btns"><button onclick="go(2)">← Back</button><button class="main" onclick="go(4)">One last thing, my love ✨</button></div>`,
`<div class="kicker">${longDate} · Our special day</div><div class="final-circle"><span>💞</span></div><div class="script">Happy Anniversary, Dithi!</div><h1 class="gradient">I choose you.<br>Every time.</h1><div class="names"><span class="name">Your Siful</span><span class="heart">♥</span><span class="name">His Dithi</span></div><p class="sub">No matter how many pages life gives us, my favourite story will always be the one where I get to love you. Here’s to us, my beautiful wife. 🥂💗</p><div class="btns"><button class="main" onclick="celebrate()">A little celebration for you 🎉</button><button onclick="restart()">Read my letter again ↺</button></div>`
];
let index=0;
function go(n){index=n;const el=document.getElementById('scene');el.innerHTML=pages[index];el.style.animation='none';void el.offsetWidth;el.style.animation='enter .8s cubic-bezier(.16,1,.3,1) both';document.getElementById('fill').style.width=((index+1)/pages.length*100)+'%';document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});if(index===4)setTimeout(celebrate,400)}
function restart(){go(0)}
function celebrate(){const chars=['♡','♥','✦','✧','💗','🌹','✨'];for(let i=0;i<85;i++)setTimeout(()=>{const x=document.createElement('span');x.className='confetti';x.textContent=chars[Math.floor(Math.random()*chars.length)];x.style.left=Math.random()*100+'vw';x.style.fontSize=(12+Math.random()*19)+'px';x.style.color=['#ffb4d4','#ffe7ad','#fff','#f4caff'][Math.floor(Math.random()*4)];x.style.setProperty('--dur',(3.5+Math.random()*4)+'s');x.style.setProperty('--drift',((Math.random()-.5)*160)+'px');x.style.setProperty('--spin',((Math.random()-.5)*900)+'deg');document.body.appendChild(x);setTimeout(()=>x.remove(),8000)},i*22)}
document.getElementById('stage').addEventListener('pointerdown',e=>{const r=e.currentTarget.getBoundingClientRect(),s=document.createElement('span');s.className='spark';s.textContent='✧';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';e.currentTarget.appendChild(s);setTimeout(()=>s.remove(),1000)});
const c=document.getElementById('sky'),ctx=c.getContext('2d');let w,h,dpr,stars=[];
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(100,Math.floor(w*h/7000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.25,p:Math.random()*6,v:Math.random()*.014+.003,a:Math.random()*.55+.15}))}
function draw(){ctx.clearRect(0,0,w,h);for(const s of stars){s.p+=s.v;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,225,240,${s.a*(.55+.45*Math.sin(s.p))})`;ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',resize,{passive:true});resize();draw();go(0);
</script>
</body>
</html>
